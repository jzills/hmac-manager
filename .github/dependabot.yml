version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/client/lib"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/client/sample"
    schedule:
      interval: "weekly"

  # The samples under /samples deliberately have no npm entry. Their only
  # dependency is a file: link to client/lib, so there is nothing external to
  # pin, no lockfile is committed, and there would be nothing for Dependabot to
  # update. The Sample Builds job in pr.yml is what keeps them honest instead.
