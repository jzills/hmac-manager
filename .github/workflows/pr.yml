name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Unit
        run: dotnet restore

      - name: Build
        working-directory: ./test/Unit
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Unit
        run: dotnet test --no-build --verbosity normal

  operator-tests:
    name: Operator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Operator
        run: dotnet restore

      - name: Build
        working-directory: ./test/Operator
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Operator
        run: dotnet test --no-build --verbosity normal

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mirrors the test job in npm-release.yml, which until now was the only
      # place these ever ran — at release time, on a tag, after the code had
      # already been merged. A break in the TypeScript client reached develop
      # unnoticed and surfaced only when someone tried to publish.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: client/lib/package-lock.json

      - name: Install dependencies
        working-directory: ./client/lib
        run: npm ci

      # The actual type gate, and the only step here that is one. vite-plugin-dts
      # prints tsc's errors during the build below but the build still exits 0, and
      # vitest transpiles through esbuild without checking types at all — so before
      # this step existed a type error passed both of them and reached develop.
      - name: Typecheck
        working-directory: ./client/lib
        run: npm run typecheck

      # Not redundant with the tests below. vitest only loads the modules its
      # tests import, so nothing exercises src/index.ts — the package's entry
      # point, and the thing npm-release.yml publishes. A broken import there
      # fails this step and passes the tests.
      - name: Build
        working-directory: ./client/lib
        run: npm run build

      - name: Run tests
        working-directory: ./client/lib
        run: npx vitest run

  ci-script-tests:
    name: CI Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck .github/scripts/*.sh

      - name: Test previous-tag.sh
        run: bash .github/scripts/previous-tag.test.sh

      - name: Test create-release.sh
        run: bash .github/scripts/create-release.test.sh

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Integration
        run: dotnet restore

      - name: Build
        working-directory: ./test/Integration
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Integration
        run: dotnet test --no-build --verbosity normal
