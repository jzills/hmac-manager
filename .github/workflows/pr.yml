name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Unit
        run: dotnet restore

      - name: Build
        working-directory: ./test/Unit
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Unit
        run: dotnet test --no-build --verbosity normal

  operator-tests:
    name: Operator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Operator
        run: dotnet restore

      - name: Build
        working-directory: ./test/Operator
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Operator
        run: dotnet test --no-build --verbosity normal

  ci-script-tests:
    name: CI Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck .github/scripts/*.sh

      - name: Test previous-tag.sh
        run: bash .github/scripts/previous-tag.test.sh

      - name: Test create-release.sh
        run: bash .github/scripts/create-release.test.sh

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        working-directory: ./test/Integration
        run: dotnet restore

      - name: Build
        working-directory: ./test/Integration
        run: dotnet build --no-restore

      - name: Test
        working-directory: ./test/Integration
        run: dotnet test --no-build --verbosity normal
