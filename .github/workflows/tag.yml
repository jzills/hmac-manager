name: Tag Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Push the tag with a PAT, not GITHUB_TOKEN: tags pushed by the
          # automatic token are deliberately blocked from triggering other
          # workflows, so release.yml / *-release.yml never fire. A PAT push
          # triggers them normally.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Extract tag from branch name
        id: version
        run: |
          TAG=$(bash .github/scripts/extract-version.sh "${{ github.event.pull_request.head.ref }}")
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"

  merge-back:
    name: Merge Release Back to Develop
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release branch has changes to merge back
        run: |
          # checkout on a pull_request event leaves a narrow fetch refspec, so
          # fetch into explicit remote-tracking refs — a bare `git fetch origin <branch>`
          # only writes FETCH_HEAD, leaving origin/develop et al. unresolvable below.
          git fetch origin \
            "develop:refs/remotes/origin/develop" \
            "${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          if git diff --quiet "origin/develop...origin/${{ github.event.pull_request.head.ref }}"; then
            echo "::error::Release branch '${{ github.event.pull_request.head.ref }}' has no changes vs develop." \
              "Did you forget to bump the version (HmacManager.csproj, the service project, the operator project, Chart.yaml, or client/lib/package.json) before merging?" \
              "Nothing to merge back into develop — fix the version bump and push a follow-up commit or handle the merge manually."
            exit 1
          fi

      - name: Open, await checks on, and merge the back-merge PR
        env:
          # PAT rather than GITHUB_TOKEN: a PR opened by the automatic token
          # does not run checks without a manual approval, and this job waits
          # on those checks below.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "chore: merge ${{ github.event.pull_request.head.ref }} back into develop" \
            --body "Automated post-release merge. Brings release fixes and merge commits from \`${{ github.event.pull_request.head.ref }}\` back into \`develop\` to keep branches in sync per gitflow." \
            --base develop \
            --head "${{ github.event.pull_request.head.ref }}")

          # Wait for the required checks and merge, rather than asking for an
          # auto-merge.
          #
          # `gh pr merge --auto` cannot be trusted in the seconds after a PR is
          # opened. GitHub computes mergeability asynchronously, so in that
          # window the branch ruleset's required checks do not exist yet and the
          # PR looks mergeable. Both outcomes were observed on 2026-08-14:
          #
          #   - auto-merge was enabled and GitHub dropped it two seconds later,
          #     having nothing to wait for (nuget/v2.9.0: auto_merge_enabled
          #     02:17:55, auto_merge_disabled 02:17:57). The job went green and
          #     the PR sat open.
          #   - gh decided the PR was mergeable now and called mergePullRequest,
          #     which the ruleset rejected with "3 of 3 required status checks
          #     are expected" (service/v0.4.0). The job went red although the
          #     release itself had succeeded.
          #
          # Waiting is also better signal: this job now goes green only if the
          # back-merge actually happened.

          # A PR has no check runs at all for its first few seconds, and
          # `gh pr checks` treats that as an error rather than as "pending", so
          # wait for them to appear before watching them.
          # if/then rather than `[ ... ] && break`: steps run under `bash -e`,
          # where the trailing form is easy to misread as safe.
          for _ in $(seq 60); do
            COUNT=$(gh pr checks "$PR_URL" --required --json name --jq 'length' 2>/dev/null || echo 0)
            if [ "${COUNT:-0}" -gt 0 ]; then
              break
            fi
            sleep 5
          done

          # --required gates on the three checks the ruleset actually enforces
          # (Unit, Integration, CI Script — about two minutes), so this does not
          # wait on the much slower E2E suite.
          gh pr checks "$PR_URL" --watch --required --fail-fast --interval 15
          gh pr merge "$PR_URL" --merge
