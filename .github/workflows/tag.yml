name: Tag Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Push the tag with a PAT, not GITHUB_TOKEN: tags pushed by the
          # automatic token are deliberately blocked from triggering other
          # workflows, so release.yml / *-release.yml never fire. A PAT push
          # triggers them normally.
          token: ${{ secrets.RELEASE_PAT }}

      # Every value from the event reaches a script through env, never through ${{ }} inside
      # run: — that is substituted into the script text before bash parses it, so a branch named
      # release/v1.0.0$(…) would run as code. Git allows $, ( and ) in branch names.
      - name: Extract tag from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          TAG=$(bash .github/scripts/extract-version.sh "$HEAD_REF")
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  merge-back:
    name: Merge Release Back to Develop
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release branch has changes to merge back
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # checkout on a pull_request event leaves a narrow fetch refspec, so
          # fetch into explicit remote-tracking refs — a bare `git fetch origin <branch>`
          # only writes FETCH_HEAD, leaving origin/develop et al. unresolvable below.
          git fetch origin \
            "develop:refs/remotes/origin/develop" \
            "$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          if git diff --quiet "origin/develop...origin/$HEAD_REF"; then
            echo "::error::Release branch '$HEAD_REF' has no changes vs develop." \
              "Did you forget to bump the version (HmacManager.csproj, HmacManager.StackExchangeRedis.csproj, the service project, the operator project, Chart.yaml, or client/lib/package.json) before merging?" \
              "Nothing to merge back into develop — fix the version bump and push a follow-up commit or handle the merge manually."
            exit 1
          fi

      - name: Open, await checks on, and merge the back-merge PR
        env:
          # PAT rather than GITHUB_TOKEN: a PR opened by the automatic token
          # does not run checks without a manual approval, and this job waits
          # on those checks below.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "chore: merge $HEAD_REF back into develop" \
            --body "Automated post-release merge. Brings release fixes and merge commits from \`$HEAD_REF\` back into \`develop\` to keep branches in sync per gitflow." \
            --base develop \
            --head "$HEAD_REF")

          # Retry the merge until the develop ruleset accepts it.
          DEADLINE=$((SECONDS + 1800))
          while true; do
            if OUT=$(gh pr merge "$PR_URL" --merge 2>&1); then
              echo "$OUT"
              break
            fi
            echo "Not mergeable yet: $OUT"

            FAILED=$(gh pr checks "$PR_URL" --required --json name,bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' \
              2>/dev/null || true)
            if [ -n "$FAILED" ]; then
              echo "::error::Required checks failed on the back-merge PR ($FAILED). Fix them and merge $PR_URL by hand."
              exit 1
            fi

            if [ "$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable')" = "CONFLICTING" ]; then
              echo "::error::The back-merge PR conflicts with develop. Resolve and merge $PR_URL by hand."
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::The back-merge PR was still not mergeable after 30 minutes. Merge $PR_URL by hand."
              exit 1
            fi

            sleep 20
          done
