apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hmacpolicies.hmac-manager.io
spec:
  group: hmac-manager.io
  scope: Namespaced
  names:
    kind: HmacPolicy
    listKind: HmacPolicyList
    plural: hmacpolicies
    singular: hmacpolicy
    shortNames:
      - hmacpol
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Public Key
          type: string
          jsonPath: .spec.publicKey
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - publicKey
              properties:
                publicKey:
                  type: string
                  minLength: 1
                privateKeySecretRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
                algorithms:
                  type: object
                  properties:
                    contentHash:
                      type: string
                      enum: [SHA1, SHA256, SHA512]
                    signingHash:
                      type: string
                      enum: [HMACSHA1, HMACSHA256, HMACSHA512]
                nonce:
                  type: object
                  properties:
                    maxAgeInSeconds:
                      type: integer
                      minimum: 1
                schemes:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                      headers:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              minLength: 1
                            claimType:
                              type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
