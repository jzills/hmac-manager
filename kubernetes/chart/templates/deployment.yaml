{{- if and (gt (int .Values.replicaCount) 1) (not .Values.redis.enabled) }}
{{- fail "replicaCount > 1 requires redis.enabled=true: the in-process nonce cache is not shared across pods, so replay protection would be bypassed. Set replicaCount to 1 for a single-replica deployment, or enable Redis (redis.enabled=true) to scale safely." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hmac-manager.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hmac-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hmac-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "hmac-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      volumes:
        # Both aggregate resources are written by the operator from the HmacPolicy resources, so
        # they may not exist yet on a fresh install — optional lets the pod start and pick them up
        # (via config reload) once the operator has reconciled at least once.
        - name: config
          configMap:
            name: {{ include "hmac-manager.fullname" . }}-config
            optional: true
        - name: secret-keys
          secret:
            secretName: {{ include "hmac-manager.fullname" . }}-keys
            optional: true
      containers:
        - name: {{ include "hmac-manager.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/hmac-manager
              readOnly: true
            - name: secret-keys
              mountPath: /etc/hmac-manager/secrets
              readOnly: true
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.service.port }}"
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            # Required for reloadOnChange (config.json + key files) to fire on a running pod.
            # kubelet updates a mounted ConfigMap/Secret by atomically swapping the volume's
            # `..data` symlink; .NET's default inotify FileSystemWatcher watches the file path and
            # never observes that swap, so live policy changes would be ignored until a restart.
            # The polling watcher re-checks on an interval and does pick the change up, which is
            # what makes the operator's reconcile take effect without a pod restart.
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "true"
            {{- if .Values.redis.enabled }}
            - name: ConnectionStrings__Redis
              value: {{ include "hmac-manager.redisAddress" . | quote }}
            {{- end }}
