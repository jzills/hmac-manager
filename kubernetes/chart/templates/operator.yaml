apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hmac-manager.fullname" . }}-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hmac-manager.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hmac-manager.fullname" . }}-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hmac-manager.labels" . | nindent 4 }}
rules:
  # Watch the policies this operator reconciles and report status back on them.
  - apiGroups: ["hmac-manager.io"]
    resources: ["hmacpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hmac-manager.io"]
    resources: ["hmacpolicies/status"]
    verbs: ["get", "update", "patch"]
  # Read referenced key Secrets and own the aggregate ConfigMap + Secret the pods mount.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Leader-election lease (the controller framework coordinates a single active reconciler).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Surface reconcile outcomes as Kubernetes events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hmac-manager.fullname" . }}-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hmac-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hmac-manager.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "hmac-manager.fullname" . }}-operator
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hmac-manager.fullname" . }}-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hmac-manager.labels" . | nindent 4 }}
spec:
  # A single reconciler owns the aggregate resources; more than one replica would need
  # leader election to avoid competing writes.
  replicas: 1
  selector:
    matchLabels:
      {{- include "hmac-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "hmac-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "hmac-manager.fullname" . }}-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: Operator__WatchNamespace
              value: {{ .Values.namespace | quote }}
            - name: Operator__ConfigMapName
              value: {{ include "hmac-manager.fullname" . }}-config
            - name: Operator__SecretName
              value: {{ include "hmac-manager.fullname" . }}-keys
            - name: Operator__NonceCacheType
              value: {{ ternary "Distributed" "Memory" .Values.redis.enabled | quote }}
