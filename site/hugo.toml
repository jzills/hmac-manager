# Hugo configuration for the HmacManager site.
#
# A landing page at / and the documentation under /docs/. The docs layout is
# Hextra's own — adding content/docs/ is what turns on the sidebar, the
# right-hand table of contents and the search below.
#
# This site is published into the gh-pages branch alongside the Helm chart
# repository that already lives there (index.yaml and the chart tarballs). See
# .github/workflows/pages.yml: the sync deletes stale site output but excludes
# those files, so `helm repo add zills https://j.zills.io/hmac-manager`
# keeps resolving. Changing baseURL means changing the chart URLs too: PAGES_URL
# in .github/workflows/chart-release.yml.
#
# j.zills.io is the custom domain on the owner's user site, which GitHub Pages
# applies to this project site as well; jzills.github.io/hmac-manager/ now only
# answers with a 301 to it, so it must not be the canonical URL.
baseURL = "https://j.zills.io/hmac-manager/"

# The name, not a tagline. kx's site titles itself "kubectl, indexed." because
# "kx" alone means nothing to a reader — the opposite is true here: almost
# everyone arriving has already seen "HmacManager" on nuget.org, npm, Docker
# Hub or Artifact Hub, and that is the string they search for. Hextra titles
# the home page with this alone and every other page as "Page – this".
title = "HmacManager"

# No tag or category pages: no page has either, so Hugo's default /tags/ and
# /categories/ were empty, and listed in the sitemap they were indexed as thin
# pages.
disableKinds = ["taxonomy", "term"]

# label is a custom param, so it belongs under params — Hugo deprecated setting
# it on the language itself in 0.112.0 and warns on every build otherwise.
[languages.en]
  [languages.en.params]
    label = "English"

# The site is its own Hugo module. There is no Go module anywhere else in this
# repository, so Hextra is isolated by construction — it cannot reach the .NET
# or npm dependency graphs, and it is deliberately absent from
# .github/dependabot.yml: the theme is pinned on purpose.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # Nothing is mounted from the repository root. assets/logo.svg there is the
  # README's copy, drawn as <text>; the site carries its own vector wordmark
  # under assets/ and mounting both would publish two marks that can disagree.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Mounted a second time so resources.Get can read the generated favicon:
  # head-end.html needs it as a resource, and a second copy of the file under
  # assets/ is a copy that can go stale.
  [[module.mounts]]
    source = "static"
    target = "assets"
  # Read, not published: the Releases page renders each artifact's notes from
  # release-notes/<artifact>/, the same files create-release.sh puts at the
  # top of each GitHub release. Mounted rather than copied into site/, since a
  # copy goes stale with every release.
  [[module.mounts]]
    source = "../release-notes"
    target = "assets/release-notes"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

  # The typographer stays on for quotes, but its dash substitutions are
  # neutralised. It rewrites "--" as an en dash, and these docs are dense with
  # flags — `--set`, `--namespace`, `--create-namespace`, `--version`,
  # `--decode` — every one of which would render as "–set" and stop being
  # copy-pasteable. Setting the replacements to the literal characters is
  # narrower than disabling the extension, which would also give up the curly
  # quotes.
  [markup.goldmark.extensions.typographer]
    enDash = "--"
    emDash = "---"

[params]
  description = "Secure HMAC request authentication for ASP.NET Core — as a NuGet library, or as an Istio ext-authz service with a Kubernetes operator for declarative policies."

  # Both off: layouts/_partials/navbar-title.html draws the mark itself,
  # inlined so it takes its colour from the active theme.
  [params.navbar]
    displayTitle = false
    displayLogo = false
    width = "normal"

  # The footer is layouts/_partials/custom/footer.html, filled from
  # [params.oss] below; the theme's copyright and "Powered by" rows are off.
  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = "normal"

  # The page, navbar and footer widths, stated on every project docs site so
  # their columns line up when you move from one to the next.
  [params.page]
    width = "normal"

  [params.search]
    enable = true

    [params.search.flexsearch]
      # Vendored rather than fetched. Hextra's default pulls the bundle from
      # jsDelivr with resources.GetRemote and republishes it locally, so the
      # published page is self-hosted either way — but the *build* then needs
      # the network, and a jsDelivr blip would fail a deploy that has nothing
      # to do with jsDelivr. The bundle is recorded in THIRD_PARTY_NOTICES.md.
      #
      # Setting js alone is enough to take the local-asset branch of the
      # theme's scripts/search.html; base is only for a different CDN.
      js = "vendor/flexsearch/flexsearch.bundle.min.js"

  # Hextra's own light/dark toggle, unmodified. kx replaces this partial with a
  # ten-palette menu because its palettes are generated from the CLI's theme
  # registry; there is no such registry here, so two modes is the whole story
  # and the stock control is the right one. It sits in the navbar (the Theme
  # menu entry below); displayToggle governs a second copy, in a sticky bar at
  # the foot of the docs sidebar, doing what the navbar's already does.
  [params.theme]
    default = "dark"
    displayToggle = false

# The footer, shared by every project docs site: the markup is
# layouts/_partials/custom/footer.html and the install command is
# layouts/_partials/oss/footer-command.html. Keys are lowercase, as Hugo
# stores them. A link is a site `path`, an absolute `url`, or kind = "bug",
# which opens a new issue with `bug` as its body; the body asks which of the
# four artifacts the reader runs, since each has its own version.
[params.oss]
  name = "HmacManager"
  mark = "hm-mark.svg"
  showname = true
  tagline = "HMAC request authentication, in your app or in your mesh. Sign and verify requests against named policies, with replay protection built in."
  repo = "https://github.com/jzills/hmac-manager"
  bug = """**What happened**


**What you expected**


**Steps to reproduce**


**Versions**

Which you run (the NuGet package, the npm client, the ext-authz image or the Helm chart) and its version.
"""

  [[params.oss.columns]]
    heading = "Get started"
    links = [
      { label = "Install", path = "docs/getting-started/install/" },
      { label = ".NET quickstart", path = "docs/getting-started/dotnet-quickstart/" },
      { label = "Kubernetes quickstart", path = "docs/getting-started/kubernetes-quickstart/" },
      { label = "Client quickstart", path = "docs/getting-started/client-quickstart/" },
    ]
  [[params.oss.columns]]
    heading = "Learn"
    links = [
      { label = "Concepts", path = "docs/concepts/" },
      { label = ".NET", path = "docs/dotnet/" },
      { label = "Kubernetes", path = "docs/kubernetes/" },
      { label = "Reference", path = "docs/reference/" },
    ]
  [[params.oss.columns]]
    heading = "Project"
    links = [
      { label = "GitHub", url = "https://github.com/jzills/hmac-manager" },
      { label = "Release notes", path = "releases/" },
      { label = "Report a bug", kind = "bug" },
      { label = "MIT license", url = "https://github.com/jzills/hmac-manager/blob/HEAD/LICENSE" },
    ]

# The bar holds a first visitor's top tasks, the same on each of the project
# sites: Documentation, Quickstart, Releases, Search, GitHub and the
# light/dark button. The landing page's own sections (.NET, Kubernetes,
# Client) are a scroll away, and a menu of them read as its table of
# contents. Quickstart is the .NET one, where most readers start; the docs
# index links the other two.
[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Quickstart"
    pageRef = "/docs/getting-started/dotnet-quickstart"
    weight = 2
  [[menu.main]]
    name = "Releases"
    pageRef = "/releases"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/hmac-manager"
    weight = 5
    [menu.main.params]
      icon = "github"
  [[menu.main]]
    name = "Theme"
    weight = 6
    [menu.main.params]
      type = "theme-toggle"
